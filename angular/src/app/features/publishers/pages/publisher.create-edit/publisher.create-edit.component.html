<div class="m-3">

  <div class="mb-3">
    <h2 class="m-0 font-weight-bold text-dark">
      {{ isEditMode ? 'Yayınevi Güncelle' : 'Yeni Yayınevi Ekle' }}
    </h2>
  </div>

  <div class="card shadow-sm">
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row">
        <div class="col-6">
            <label class="form-label">Yayınevi Adı</label>
            <input formControlName="name" class="form-control" />
            @if (form.get('name')?.invalid && form.get('name')?.touched) {
              <span class="text-danger">Yayınevi adı zorunludur.</span>
            }
          </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn bg-olive text-white mr-2">
          {{ isEditMode ? 'Güncelle' : 'Kaydet' }}
        </button>
        <button type="button" class="btn btn-secondary ml-2" (click)="cancel()">İptal</button>
      </div>
    </form>
  </div>
  </div>
</div>
