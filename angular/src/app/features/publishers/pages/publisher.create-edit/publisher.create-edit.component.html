<div class="card">
  <div class="card-header">
    <h3 class="card-title">{{ isEditMode ? 'Yayınevi Güncelle' : 'Yeni Yayınevi Ekle' }}</h3>
  </div>

  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="row">
        <div class="col-6">
            <label class="form-label">Yayınevi Adı</label>
            <input formControlName="name" class="form-control" />
            @if (form.get('name')?.invalid && form.get('name')?.touched) {
              <span class="text-danger">Yayınevi adı zorunludur.</span>
            }
          </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-primary">
          {{ isEditMode ? 'Güncelle' : 'Kaydet' }}
        </button>
        <button type="button" class="btn btn-secondary ml-2" (click)="cancel()">İptal</button>
      </div>
    </form>
  </div>
</div>
